  </defs>

  <rect width="100%" height="100%" fill="url(#paper)"/>
  <ellipse cx="288" cy="234" rx="360" ry="225"
           fill="#d8b0ac" opacity=".62" filter="url(#blur)" transform="rotate(-14 288 234)"/>
  <ellipse cx="876" cy="594" rx="408" ry="243"
